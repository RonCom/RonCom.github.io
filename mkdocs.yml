site_name: Chris Lavelle
site_url: https://roncom.github.io/
site_description: Data science projects, write-ups and tutorials
site_author: Chris Lavelle
repo_url: https://github.com/RonCom
repo_name: RonCom

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      archive: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RonCom
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lavellechristopher

nav:
  - Home: index.md
  - Projects: projects.md
  - Blog:
      - blog/index.md
  - About: about.md
